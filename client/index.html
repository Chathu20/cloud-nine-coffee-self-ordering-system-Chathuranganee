<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Nine Coffee Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load in the background, so a slow mobile connection never blocks the page from showing -->
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Shown the instant the page arrives (before the app's code has downloaded),
         so a phone on a slow connection never sees a blank white screen.
         React replaces it as soon as the app starts. -->
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f5ede3;color:#5b3a29;font-family:system-ui,sans-serif;text-align:center;padding:24px">
        <div style="font-size:56px;line-height:1">☕</div>
        <div style="font-size:20px;font-weight:700">Cloud Nine Coffee Bar</div>
        <div style="font-size:15px;opacity:.75">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
